    GerarCiotDto:
      description: "Classe para requisição de geração de CIOT.\r\nContém os dados\
        \ necessários para gerar um novo CIOT (Código Identificador\r\nda Operaçã\
        o de Transporte) associado a um MDF-e. Reflete os campos mínimos\r\ndo modelo\
        \ de domínio necessários para a operação."
      type: object
      properties:
        destinatario:
          description: "Dados do destinatário da operação de transporte.\r\nConté\
            m informações completas do destinatário incluindo CPF/CNPJ, nome,\r\n\
            endereço completo e outros dados de identificação necessários\r\npara\
            \ a emissão do CIOT."
          $ref: '#/components/schemas/DestinatarioCiotDto'
        pagamentos:
          description: "Lista de pagamentos associados à operação CIOT.\r\nContém\
            \ informações sobre os valores pagos, datas de pagamento\r\ne outros detalhes\
            \ financeiros relacionados à operação\r\nde transporte."
          type: array
          items:
            $ref: '#/components/schemas/PagamentoCiotDto'
        imposto:
          description: "Informações sobre os impostos da operação.\r\nContém os valores\
            \ dos tributos incidentes sobre a operação\r\nde transporte, incluindo\
            \ IRRF, INSS, ISSQN e SEST/SENAT."
          $ref: '#/components/schemas/ImpostoCiotDto'
        informacoesBancarias:
          description: "Dados bancários para recebimento dos valores.\r\nContém informaç\
            ões sobre a instituição bancária, agência\r\ne conta onde serão depositados\
            \ os valores da operação\r\nde transporte."
          $ref: '#/components/schemas/InformacoesBancariasCiotDto'
      example:
        destinatario:
          cpfCnpj: '01014373000265'
          nome: Fernando Castro
          cep: 52070010
          rua: Cons. Nabuco
          numero: 360
          bairro: Casa Amarela
          codMunicipio: 2607901
        pagamentos:
          - valorPagamento: 300.0
            dataPagamento: null
        imposto:
          irrf: 10.0
          inss: 0.0
          issqn: 20.0
          sestSenat: 30.0
        informacoesBancarias:
          instituicaoBancaria: 237
          agencia: 3477
          conta: 14272-7
    GerarCiotResponseDto:
      description: "Classe para resposta de geração de CIOT.\r\nContém os dados retornados\
        \ pelo sistema após a solicitação\r\nde geração de um novo CIOT, incluindo\
        \ o código de identificação\r\ne status da operação."
      type: object
      properties:
        codigoIdentificacaoOperacao:
          description: "Código de identificação da operação CIOT gerada.\r\nIdentificador\
            \ único atribuído à operação de transporte\r\nno momento da sua criaçã\
            o. Este código deve ser utilizado\r\npara consultas, cancelamentos e outras\
            \ operações relacionadas\r\nao CIOT gerado."
          type: string
        sucesso:
          description: Indica se a operação de geração foi realizada com sucesso.
          type: boolean
        mensagem:
          description: Mensagem de erro da operação. Em caso de erro
          type: string
        pdfUrl:
          description: "URL para acesso ao documento PDF do CIOT gerado.\r\nEndereç\
            o web onde o documento PDF está disponível\r\npara download ou visualizaç\
            ão. Esta URL pode ser utilizada\r\npara acessar diretamente o documento\
            \ do CIOT."
          type: string
        protocolo:
          description: "Protocolo da operação de geração do CIOT.\r\nNúmero único\
            \ que identifica a solicitação de geração no sistema."
          type: string
        codigo:
          description: Código de identificação da mensagem de erro. Em caso de erro
          type: string
      example:
        codigoIdentificacaoOperacao: 165000055645/6023
        sucesso: true
        mensagem: ""
        pdfUrl: https://mock-s3-url.com/pdf/ciot-165000055645-6023.pdf
        protocolo: 4438611
